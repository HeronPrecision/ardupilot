# Working OpenOCD configuration for HRON-Chickadee STM32H743
# Based on successful connection

# Interface configuration
source [find interface/stlink.cfg]

# Transport selection - use HLA_SWD for ST-LINK
transport select hla_swd

# Target configuration
source [find target/stm32h7x.cfg]

# Override problematic debug register access
proc stm32h7x_dbgmcu_enable {args} {
    echo "Skipping DBGMCU register access for HRON-Chickadee"
    return
}

# Reset configuration - connect under reset
reset_config srst_only srst_nogate connect_assert_srst

# Enable telnet interface for debugging
telnet_port 4444

# Enable GDB server
gdb_port 3333

# Commands to run after init
stm32h7x.cpu0 configure -event gdb-attach {
    echo "GDB attached to HRON-Chickadee"
}
