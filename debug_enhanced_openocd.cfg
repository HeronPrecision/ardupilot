# HRON-Chickadee-RC3 Enhanced Debug Configuration
# Fixed transport selection

source [find interface/stlink.cfg]
transport select swd
source [find target/stm32h7x.cfg]

reset_config connect_assert_srst
adapter speed 4000

# Custom procedures for bootloader handling
proc handle_bootloader_init {} {
    echo "HRON-Chickadee-RC3 bootloader initialization..."
    set attempts 0
    while {$attempts < 3} {
        catch {halt} result
        if {[string match "*failed*" $result]} {
            echo "Bootloader halt failed - attempting reset (attempt $attempts)"
            catch {reset init} result2
            echo "Reset result: $result2"
            incr attempts
            sleep 100
            continue
        } else {
            echo "Bootloader halted successfully on attempt $attempts"
            return 0
        }
    }
    echo "Failed to halt bootloader after 3 attempts"
    return -1
}

proc dump_processor_status {} {
    echo "=== HRON-Chickadee-RC3 Processor Status ==="
    catch {reg pc} pc_val
    catch {reg psp} psp_val
    catch {reg msp} msp_val
    catch {reg xpsr} xpsr_val
    catch {reg cpsr} cpsr_val
    
    echo "PC: 0x[string repeat "0" [expr {8 - [string length $pc_val]}]]$pc_val"
    echo "PSP: 0x[string repeat "0" [expr {8 - [string length $psp_val]}]]$psr_val"  
    echo "MSP: 0x[string repeat "0" [expr {8 - [string length $msp_val]}]]$msp_val"
    if {[info exists xpsr_val]} {
        echo "XPSR: 0x[string repeat "0" [expr {8 - [string length $xpsr_val]}]]$xpsr_val"
    }
    if {[info exists cpsr_val]} {
        echo "CPSR: $cpsr_val"
    }
    echo "=================================="
}

# Initialize and debug
init
echo "Debug interface initialized"

# Try to connect and halt
if {[handle_bootloader_init] == 0} {
    dump_processor_status
    echo "Attempting to read memory around PC..."
    set pc [reg pc]
    catch {mdw $pc 16} mem_result
    echo "Memory dump around PC: $mem_result"
} else {
    echo "Failed to establish reliable debug connection"
}
